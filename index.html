<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Can You Afford Your Life?</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#1b2937;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#153654;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{max-width:1080px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #dce4eb;border-radius:15px;padding:24px;margin:14px 0;box-shadow:0 2px 9px #1232}.muted{color:#5c6c79}.small{font-size:.87rem}h1,h2,h3{margin-top:0}button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#156da4;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e8f0f7;color:#153654}button:disabled{opacity:.5;cursor:not-allowed}button+button{margin-left:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.actions button+button{margin:0}input,select{padding:9px;border:1px solid #b9c9d7;border-radius:8px;font:inherit;max-width:100%}input[type=number]{width:110px}label{display:block;margin:12px 0}label span{display:block;font-weight:600;margin-bottom:4px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e8eef2;padding:12px 0}.row:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile{border:1px solid #dce4eb;border-radius:12px;padding:15px}.value{font-size:1.7rem;font-weight:800}.negative{color:#b42318}.positive{color:#16703d}.pill{background:#dceef9;padding:4px 9px;border-radius:20px;color:#124b70;font-size:.82rem}nav{display:flex;flex-wrap:wrap;gap:8px}.bar{height:9px;background:#dce5ec;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#1676ae}.notice{background:#fff7e6;border-left:4px solid #e4a233;padding:12px;margin:15px 0}.fine{font-size:.82rem;color:#657583}.choice{border:1 ate-columns:1fr}.pick{padding:12px}}

</style></head><body><header><div><strong>Can You Afford Your Life?</strong><div class="small">A Brooklyn budgeting simulation</div></div><div><button class="secondary" onclick="downloadSave()">Download Save</button> <button class="secondary" onclick="document.getElementById('load').click()">Load Save</button> <button class="secondary" onclick="resetGame()">New Game</button><input hidden id="load" type="file" accept=".json,application/json" onchange="loadSave(event)"></div></header><div id="journey"></div><main id="app"></main><script>
const KEY='brooklyn-budget-game-v3';const SALARIES={highschool:46000,trade:55000,associate:53000,bachelor:65000};const PATHS={highschool:{label:'High school diploma',credential:'highschool',debt:0},trade:{label:'Trade certification / apprenticeship',credential:'trade',debt:10000},associate:{label:'Community college / associate degree',credential:'associate',debt:12000},cuny:{label:'CUNY bachelor’s degree',credential:'bachelor',debt:28000},suny:{label:'SUNY bachelor’s degree',credential:'bachelor',debt:28000},private:{label:'Private college bachelor’s degree',credential:'bachelor',debt:35000}};const LOAN_RATE=.0652;function loanPayment(debt){let r=LOAN_RATE/12;return debt?Math.round(debt*r/(1-Math.pow(1+r,-120))):0}function salary(){return SALARIES[PATHS[s.pathway]?.credential||'highschool']} // illustrative early-career salaries
const categories=[['income','Income & Taxes'],['saving','Savings & Retirement'],['housing','Housing'],['utilities','Utilities & Subscriptions'],['transport','Transportation'],['food','Food'],['health','Health & Personal Care'],['loans','Student Loans'],['personal','Personal & Discretionary']];
const defaults={phase:'welcome',step:0,editing:null,student:'',pathway:null,saving:5,retirement:5,renters:20,internet:65,streaming:30,phone:60,car:'basic',gas:125,transit:150,groceries:400,meals:3,mealPrice:20,health:true,dental:true,vision:true,groomingCost:60,groomingWeeks:4,gym:0,personal:{entertainment:50,shopping:75,social:50,other:25},first:null,revised:null,idealApartment:null,finalApartment:null,aptForm:{neighborhood:'',rent:'',url:'',heat:'unknown'}};
let s={...structuredClone(defaults),...readSave()};if(!PATHS[s.pathway]){s.pathway=null;if(s.phase!=='welcome')s.phase='welcome'};function readSave(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function money(n){return '$'+Math.round(n).toLocaleString('en-US')}function gross(){return salary()/12}
function bracketTax(income,levels){let tax=0,prev=0;for(const [limit,rate] of levels){let amt=Math.max(0,Math.min(income,limit)-prev);tax+=amt*rate;prev=limit;if(income<=limit)break}return tax}
function taxes(){let annual=salary();let fed=bracketTax(Math.max(0,annual-16500),[[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]]);let ny=bracketTax(Math.max(0,annual-8000),[[8500,.04],[11700,.045],[13900,.0525],[80650,.055],[215400,.06],[1077550,.0685],[Infinity,.0965]]);let city=bracketTax(Math.max(0,annual-8000),[[12000,.03078],[25000,.03762],[50000,.03819],[Infinity,.03876]]);return {federal:fed/12,state:ny/12,city:city/12,social:annual*.062/12,medicare:annual*.0145/12}}
function net(){return gross()-Object.values(taxes()).reduce((a,b)=>a+b,0)}
function taxDetails(){let ts=taxes();let rows=[['Federal income tax',ts.federal,'National defense, federal courts, scientific research, and federal programs.'],['New York State income tax',ts.state,'State school aid, Medicaid, roads, and transit support.'],['NYC income tax',ts.city,'City services including sanitation, parks, libraries, schools, and firefighters.'],['Social Security (6.2%)',ts.social,'Retirement, disability, and survivor benefits.'],['Medicare (1.45%)',ts.medicare,'Federal health coverage primarily for people 65 and older and some people with disabilities.']];return `<div class="grid"><div class="tile">Annual gross salary<div class="value">${money(salary())}</div></div><div class="tile">Gross monthly pay<div class="value">${money(gross())}</div></div><div class="tile">Monthly take-home pay<div class="value positive">${money(net())}</div></div></div><h3 style="margin-top:22px">Where does your paycheck go?</h3>${rows.map(([name,value,example])=>`<details class="tile" style="margin:8px 0"><summary style="cursor:pointer"><strong>${name}</strong> — ${money(value)}/month</summary><p class="small">${example}</p></details>`).join('')}<p class="fine">Illustrative 2026 single-filer withholding estimate: standard deductions, no dependents, credits, or other payroll deductions. Income taxes fund broad budgets; examples are not allocations of your specific dollars. Health insurance and retirement savings are separate expenses.</p>`}

function personalTotal(){return Object.values(s.personal).reduce((a,b)=>a+Number(b),0)}function breakdown(){let n=net(),car=s.car==='none'?0:s.car==='basic'?350+300:s.car==='better'?650+400:950+500;let apt=s.finalApartment||s.idealApartment;return {saving:n*(+s.saving + +s.retirement)/100,housing:+(apt?.rent??(n*.45)) + +s.renters,utilities:145+(apt?.heat==='included'?0:80)+ +s.internet + +s.streaming + +s.phone,transport:car+(car?100 + +s.gas:0)+ +s.transit,food:+s.groceries+(+s.meals)*(+s.mealPrice)*4,health:(s.health?450:0)+(s.dental?30:0)+(s.vision?18:0)+(+s.groomingCost)*4/(+s.groomingWeeks||4)+25+ +s.gym,loans:loanPayment(PATHS[s.pathway]?.debt||0),personal:personalTotal()}}function total(b=breakdown()){return Object.values(b).reduce((a,b)=>a+b,0)}function snapshot(){let {first,revised,final,events,answers,...choices}=s;return {choices:structuredClone(choices),costs:breakdown(),net:net(),total:total(),balance:net()-total()}}function choiceDescription(key,v){
const descriptions={
internet:{0:'Use mobile data, library or public Wi-Fi instead.',40:'Basic service for browsing, email and ordinary streaming.',65:'More bandwidth for HD video, video calls and several devices.',90:'Higher speeds for large downloads and demanding use.'},
streaming:{0:'Free, ad-supported entertainment and online videos.',15:'About one paid subscription.',30:'About two paid subscriptions.',45:'Several subscriptions with more variety.',65:'Multiple services, potentially including premium or sports content.'},
phone:{30:'Basic talk, text and data; high-speed data or priority may be limited.',60:'Regular daily use, navigation, social media and video.',90:'Premium data, hotspot allowances and possible international benefits.'},
car:{none:'Avoid car payments, insurance, maintenance and fuel; arrange other transportation.',basic:'Older, higher-mileage practical vehicle. Fewer modern features and potentially more repairs. $750/month including maintenance, before fuel.',better:'Newer used vehicle with lower mileage and more modern safety and comfort features. $1,150/month including maintenance, before fuel.',new:'New vehicle with warranty and modern features, but higher payments and depreciation. $1,550/month including maintenance, before fuel.'},
gas:{50:'Occasional driving: weekend errands and visits.',125:'Moderate driving: several days a week for work and errands.',175:'Frequent driving: most days for commuting and personal trips.'},
transit:{0:'Walk, cycle or rely on a car.',45:'Occasional bus and subway trips.',150:'Regular commuting and personal travel by bus or subway.'},
groceries:{300:'$75 per four-week-model week. Store brands, beans, rice, pasta, affordable proteins and seasonal or frozen produce. Careful planning and cooking.',400:'$100 per week. More variety of fresh produce, meat, dairy, snacks and preferred brands.',500:'$125 per week. More premium ingredients, specialty foods, prepared foods and favorite brands; less price comparison.'},
renters:{20:'Protect belongings against covered losses; may include liability and temporary housing coverage. Deductibles and exclusions apply.',0:'Save $20 monthly but bear the risk of replacing belongings yourself. Some landlords require coverage.'},
gym:{0:'Exercise at home, outdoors or using free facilities.',58:'Access to gym equipment and facilities; amenities vary.'},
mealPrice:{15:'Inexpensive takeout or quick-service meal.',20:'Typical casual meal allowance.',25:'More flexibility for restaurant meals.',35:'Higher-cost restaurant meal allowance.'}
};
if(key==='saving'||key==='retirement'){let goals=key==='saving'?{0:'No planned emergency savings.',5:'Start building an emergency cushion.',10:'Build security for unexpected bills and future purchases.',15:'Prioritize a larger emergency fund and major goals.'}:{0:'No planned retirement contributions.',5:'Begin building long-term retirement savings.',10:'Make retirement a regular financial priority.',15:'Set aside more for future financial security.'};return goals[v]+' '+money(net()*v/100)+'/month · '+money(net()*v/100*12)+'/year in planned contributions.';}
return descriptions[key]?.[v]||'';}
const artPaths={"saving": "<path d=\"M12 27h40v23H12z M18 27v-8h28v8 M32 19v-9 M27 14l5-5 5 5\"/><circle cx=\"32\" cy=\"38\" r=\"5\"/>", "retirement": "<circle cx=\"32\" cy=\"32\" r=\"20\"/><path d=\"M32 19v14l10 6\"/>", "renters": "<path d=\"M32 8l20 8v15q0 15-20 25Q12 46 12 31V16z M23 32l6 6 12-14\"/>", "internet": "<path d=\"M8 23q24-22 48 0 M16 32q16-15 32 0 M24 41q8-8 16 0\"/><circle cx=\"32\" cy=\"49\" r=\"2\"/>", "streaming": "<rect x=\"8\" y=\"13\" width=\"48\" height=\"34\" rx=\"5\"/><path d=\"M27 23l14 7-14 8z M23 54h18\"/>", "phone": "<rect x=\"19\" y=\"6\" width=\"26\" height=\"52\" rx=\"5\"/><path d=\"M27 12h10 M29 51h6\"/>", "car": "<path d=\"M9 39v-9l8-4 8-13h20l10 16v16H9z M18 26h32\"/><circle cx=\"20\" cy=\"45\" r=\"7\"/><circle cx=\"46\" cy=\"45\" r=\"7\"/>", "gas": "<rect x=\"10\" y=\"9\" width=\"27\" height=\"45\" rx=\"3\"/><rect x=\"15\" y=\"15\" width=\"17\" height=\"14\"/><path d=\"M37 32h7v13q0 8 8 5V24l-7-8 M7 55h34\"/>", "transit": "<rect x=\"12\" y=\"7\" width=\"40\" height=\"44\" rx=\"8\"/><path d=\"M18 15h28v18H18z M20 51l-6 8 M44 51l6 8\"/><circle cx=\"22\" cy=\"42\" r=\"2\"/><circle cx=\"42\" cy=\"42\" r=\"2\"/>", "groceries": "<path d=\"M8 26h48l-7 29H15z M19 26l9-18 M45 26L36 8 M24 35v12 M40 35v12\"/>", "meals": "<circle cx=\"33\" cy=\"32\" r=\"17\"/><path d=\"M7 9v20h8V9 M11 29v26 M57 9v46\"/>", "gym": "<path d=\"M8 22v20 M16 15v34 M16 32h32 M48 15v34 M56 22v20\"/>", "housing": "<path d=\"M6 30L32 8l26 22 M13 26v30h38V26 M26 56V37h12v19\"/>", "health": "<rect x=\"10\" y=\"15\" width=\"44\" height=\"39\" rx=\"6\"/><path d=\"M23 15V8h18v7 M32 25v19 M23 34h18\"/>", "personal": "<path d=\"M12 24h40l-4 32H16z M23 24V15a9 9 0 0118 0v9\"/>", "loans": "<path d=\"M6 22L32 8l26 14-26 14z M16 28v15q16 14 32 0V28 M57 23v22\"/>"};function art(key){let k=({mealPrice:"meals",groomingWeeks:"personal",income:"saving",utilities:"internet",transport:"car",food:"groceries",dental:"health",medical:"health",damage:"housing",subway:"transit",rent:"housing",hours:"saving",utility:"internet",travel:"transit",wedding:"personal",vacation:"travel",bonus:"saving",family:"personal",career:"loans"})[key]||key;return `<svg class="mini-art" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${artPaths[k]||artPaths.personal}</g></svg>`;}
function field(label,key,options){return `<div class="fieldtitle" id="label-${key}">${art(key)}<span>${label}</span></div><div class="pickgrid" role="group" aria-labelledby="label-${key}">${options.map(([v,t])=>`<label class="pick"><input type="radio" name="${key}" data-key="${key}" value="${v}" ${String(s[key])===String(v)?'checked':''}><span class="pick-copy"><strong class="pick-name">${t}</strong>${choiceDescription(key,v)?`<small class="pick-description">${choiceDescription(key,v)}</small>`:''}</span></label>`).join('')}</div>`}function num(label,key,min=0,max=1000,step=5){return `<label><span>${label}</span><input type="number" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${s[key]}"></label>`}function check(label,key){return `<label class="choice"><input type="checkbox" data-key="${key}" ${s[key]?'checked':''}>${label}</label>`}function opt(vals){return vals.map(v=>[v,v===0?'None':money(v)+'/month'])}function section(id){switch(id){case'income':return `<h2>Income & Taxes</h2><p>Your pathway: <strong>${PATHS[s.pathway].label}</strong>. Your starting salary is based on credential type, not college tuition.</p>${taxDetails()}`;
case'saving':return `<h2>Savings & Retirement</h2><p>Choose what percentage of your take-home pay to set aside in each category. Emergency savings are accessible for unexpected expenses; retirement contributions are intended for later life. Annual figures assume 12 contributions, no growth, and enough income to fund them.</p>${field('Savings contribution','saving',(s.phase==='guided'? [5,10,15]:[0,5,10,15]).map(v=>[v,v+'%']))}${field('Retirement contribution','retirement',(s.phase==='guided'?[5,10,15]:[0,5,10,15]).map(v=>[v,v+'%']))}<p class="muted">Monthly total: ${money(breakdown().saving)}</p>`;
case'housing':return `<h2>Housing</h2><p>${s.finalApartment?'Your rent is based on your selected apartment.':'Rent is initially 45% of take-home pay.'}</p><div class="tile">Monthly rent <strong>${money(s.finalApartment?.rent??net()*.45)}</strong></div><p>Landlord insurance generally protects the building, not your belongings. Renters insurance can cover theft, fire and certain water damage, personal liability and temporary living expenses after a covered loss. Deductibles and exclusions apply.</p><p>Renters insurance: ${money(s.renters)} per month. ${s.phase==='guided'?'Required in your first budget.':'Optional during revisions.'}</p>${s.phase==='guided'?'':field('Renters insurance','renters',[[20,'Keep insurance — $20/month'],[0,'Cancel insurance — $0/month']])}${s.phase!=='guided'&&+s.renters===0?'<div class="notice">Without renters insurance, replacing stolen or damaged belongings may be expensive. Some landlords require coverage.</div>':''}${s.finalApartment||s.idealApartment?`<p>Current apartment rent: <strong>${money(s.finalApartment?.rent??s.idealApartment?.rent)}</strong></p>`:''}`;
case'utilities':return `<h2>Utilities & Subscriptions</h2><p>Electricity $115, cooking gas $30, and heat/hot water $80: $225/month before optional services. Heat/hot water can be removed if your chosen apartment includes them.</p>${field('Home internet','internet',[[0,'No home internet — $0'],[40,'Basic — $40/month'],[65,'Standard — $65/month'],[90,'Premium — $90/month']])}${field('Streaming services','streaming',[[0,'Free — $0'],[15,'Basic — $15/month'],[30,'Standard — $30/month'],[45,'Expanded — $45/month'],[65,'Premium — $65/month']])}<p class="fine">Internet and streaming tiers are illustrative, not specific provider offers. Cell plans cover service only, not a new device.</p>${field('Cell phone','phone',[[30,'Budget — $30'],[60,'Standard — $60'],[90,'Premium — $90']])}`;
case'transport':return `<h2>Transportation</h2><p>A car is required in your first budget. Public transportation is optional. During revisions you may eliminate the car.</p>${field('Vehicle','car',[...(s.phase==='guided'?[]:[['none','No car']]),['basic','Basic used — $350 payment + $300 insurance'],['better','Newer used — $650 payment + $400 insurance'],['new','New — $950 payment + $500 insurance']])}${s.car!=='none'?field('Monthly gasoline','gas',[[50,'Occasional — $50/month'],[125,'Moderate — $125/month'],[175,'Frequent — $175/month']]):''}<p class="fine">Car maintenance: $100/month if you own a car. Parking and tolls are not included. Vehicle and fuel costs are illustrative.</p>${field('Public transportation','transit',[[0,'None — $0'],[45,'Occasional — $45/month'],[150,'Regular — $150/month']])}`;
case'food':return `<h2>Food</h2><p>All three grocery plans can support nutritious meals; they differ in variety, convenience and shopping flexibility. Budget for groceries even if you eat out frequently. Dining out uses a simplified four-week month.</p>${field('Groceries','groceries',[[300,'Bare Bones — $300'],[400,'Balanced — $400'],[500,'Comfort — $500']])}${field('Meals out per week','meals',[0,1,2,3,5,7,10].map(v=>[v,v+' meals']))}${field('Average cost per meal','mealPrice',[15,20,25,35].map(v=>[v,money(v)]))}<p>Dining out per month: <strong>${money(s.meals*s.mealPrice*4)}</strong></p>`;
case'health':return `<h2>Health & Personal Care</h2><p>Insurance is required in your first pass, but can be removed during revisions. Basic hygiene ($25/month) is always required. Health insurance helps cover medical care; dental insurance helps cover exams and dental treatment; vision insurance helps cover eye exams and eyewear. Coverage, deductibles and copays vary. Employers or assistance programs may reduce actual costs.</p>${s.phase==='guided'?`<div class="choice">Health insurance — $450/month<br>Dental — $30/month<br>Vision — $18/month</div>`:check('Health insurance — $450/month','health')+check('Dental insurance — $30/month','dental')+check('Vision insurance — $18/month','vision')}${num('Cost of each grooming appointment ($)','groomingCost',0,200,5)}${field('How often?','groomingWeeks',[[1,'Weekly'],[2,'Every 2 weeks'],[3,'Every 3 weeks'],[4,'Every 4 weeks'],[6,'Every 6 weeks'],[8,'Every 8 weeks'],[13,'Every 3 months']])}${field('Gym membership','gym',opt([0,58]))}${s.phase!=='guided'&&!s.health?'<div class="notice">Going without health insurance can expose you to significant medical bills. Coverage assistance may be available in real life.</div>':''}`;
case'loans':return `<h2>Student Loans</h2><p>Your education pathway was locked at the start of the game. For simplicity, student loans use a 10-year repayment at 6.52% annual interest.</p><div class="tile"><strong>${PATHS[s.pathway].label}</strong><p>Estimated loan balance: ${money(PATHS[s.pathway].debt)}<br>Monthly payment: <strong>${money(loanPayment(PATHS[s.pathway].debt))}</strong></p></div>`;
case'personal':return `<h2>Personal & Discretionary Spending</h2><p>Allocate at least <strong>$200/month</strong> across these categories, even during revisions. Entertainment includes hobbies and tickets; shopping includes clothes and shoes; social activities include outings and gifts; other wants cover miscellaneous purchases. Dining out and streaming are budgeted elsewhere.</p>${[['entertainment','Entertainment & hobbies'],['shopping','Clothing & shopping'],['social','Social activities'],['other','Other wants and miscellaneous']].map(([k,label])=>`<label><span>${label}</span><input type="number" data-personal="${k}" min="0" max="2000" step="5" value="${s.personal[k]}"></label>`).join('')}<p><strong>Total: ${money(personalTotal())}</strong> (minimum $200)</p>`;}}

h="14" height="18" rx="2" fill="#f5dca9"/><rect x="616" y="121" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="640" y="121" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="664" y="121" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="616" y="149" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="640" y="149" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="664" y="149" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="638" y="161" width="19" height="24" fill="#102e3b"/><rect x="701" y="80" width="88" height="105" fill="#a95e4d"/><rect x="698" y="75" width="94" height="7" fill="#e4bd91"/><rect x="714" y="95" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="738" y="95" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="762" y="95" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="714" y="123" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="738" y="123" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="762" y="123" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="714" y="151" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="738" y="151" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="762" y="151" width="14" height="18" rx="2" fill="#f5dca9"/><rect x="736" y="161" width="19" height="24" fill="#102e3b"/><path d="M0 198H800" stroke="#e6b86b" stroke-width="2" stroke-dasharray="24 18"/></svg><p>You've got a full-time job. You're ready to live on your own in Brooklyn.</p><h2>Can you afford the life you want?</h2><p class="muted">Choose a lifestyle first. Find out what it costs afterward.</p><label><span>Student name (optional)</span><input id="student" value="${escapeHtml(s.student)}" placeholder="Your name"></label><div class="actions" style="justify-content:center"><button onclick="start()">Begin Your Journey →</button>${s.first?'<button class="secondary" onclick="goDashboard()">Continue Saved Game</button>':''}</div><p class="fine">Progress saves automatically in this browser. Download a save file for a reliable backup.</p></div>`;return}if(s.phase==='pathway'){app.innerHTML=`<div class="panel"><h2>Choose Your Education Pathway</h2><p>This determines your starting salary and student loan payment. <strong>Your choice is permanent once confirmed.</strong></p><div class="eyebrow">Chapter 1 · Your future</div><div class="pickgrid education-grid">${Object.entries(PATHS).map(([k,p],i)=>`<label class="pick"><input type="radio" name="pathway" value="${k}" ${s.pathway===k?'checked':''}><span class="symbol" aria-hidden="true">${['🎓','🛠️','📚','🏙️','🏫','🎓'][i]}</span><span>${p.label}</span><strong>${money(SALARIES[p.credential])}</strong><small>Annual salary</small><small>${money(loanPayment(p.debt))}/month in student loans</small></label>`).join('')}</div><div class="actions"><button onclick="confirmPathway()">Confirm Education & Start Budget</button></div></div>`;return}if(s.phase==='guided'){let [id,name]=categories[s.step];app.innerHTML=`<div class="panel"><div class="row"><span class="pill">Step ${s.step+1} of ${categories.length}</span><span>${name}</span></div><div class="bar"><div style="width:${(s.step+1)/categories.length*100}%"></div></div><div class="section-content">${section(id)}</div><div class="actions"><button class="secondary" onclick="back()" ${s.step===0?'disabled':''}>Back</button><button onclick="next()">${s.step===categories.length-1?'Reveal My Budget':'Continue'}</button></div><p class="fine">Your overall budget balance is hidden until you complete all categories.</p></div>`;bind();return}if(s.editing){let id=s.editing;app.innerHTML=`<div class="panel"><button class="secondary" onclick="returnDashboard()">← Back to summary</button><hr style="border:0;border-top:1px solid #e8eef2;margin:20px 0"><div class="section-content">${section(id)}</div><div class="actions"><button onclick="returnDashboard()">Save Changes & Return to Summary</button></div></div>`;bind();return}if(s.phase==='apartment'){app.innerHTML=`<div class="panel"><div class="section-banner">${art("housing")}<div><div class="eyebrow">Chapter 4 · Find your home</div><h2>Brooklyn Apartment Hunt</h2></div></div><p>Search for a <strong>real studio or one-bedroom</strong> apartment anywhere in Brooklyn. First choose one you'd genuinely like, then decide whether it fits your budget.</p><p><a href="https://streeteasy.com/for-rent/brooklyn" target="_blank" rel="noopener">Search Brooklyn rentals on StreetEasy ↗</a></p><p class="fine">Use the advertised/base monthly rent, not a temporary promotional net-effective price.</p>${apartmentForm()}<div class="actions"><button onclick="saveApartment()">${s.idealApartment?'Update Apartment & Return to Budget':'Save My First Apartment'}</button><button class="secondary" onclick="goDashboard()">Back to Budget</button></div></div>`;return}let b=breakdown(),original=s.first?.costs||b;let delta=net()-total(b);let stage=s.phase==='revision1'?'Round 1 — Revise Your Lifestyle':'Round 2 — Your Apartment Budget';app.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">${stage}</h2><span class="pill">Budget dashboard</span></div><div class="grid"><div class="tile">Monthly take-home pay<div class="value">${money(net())}</div></div><div class="tile">Monthly expenses<div class="value">${money(total(b))}</div></div><div class="tile">Monthly balance<div class="value ${delta<0?'negative':'positive'}">${delta<0?'−':'+'}${money(Math.abs(delta))}</div></div></div><div class="spendbar" aria-label="Expense breakdown">${Object.values(b).map((v,i)=>`<div style="width:${v/total(b)*100}%;background:${['#087d73','#24536d','#d89d43','#7c83b5','#b86b59','#629a86','#8d6c9e','#9ca8ac'][i]}"></div>`).join('')}</div><div class="legend">${categories.slice(1).map(([id,n],i)=>`<span><i class="swatch" style="background:${['#087d73','#24536d','#d89d43','#7c83b5','#b86b59','#629a86','#8d6c9e','#9ca8ac'][i]}"></i>${n}</span>`).join('')}</div><p class="muted">Select any category to review your original choices and make changes. Your budget updates when you return here.</p><div class="row"><strong>Category</strong><strong>Original → Current · Difference</strong></div><details class="tile" style="margin-top:16px"><summary style="cursor:pointer"><strong>View my income & tax breakdown</strong></summary>${taxDetails()}</details>${categories.slice(1).map(([id,name])=>{let diff=original[id]-b[id];return `<div class="row">${id==='loans'?`<span><strong>${name}</strong> 🔒</span>`:`<button class="secondary" onclick="edit('${id}')">${name} ✎</button>`}<div style="text-align:right" class="money">${money(original[id])} → <strong>${money(b[id])}</strong><br><span class="small ${diff>0?'positive':diff<0?'negative':'muted'}">${diff>0?'Saved '+money(diff):diff<0?'Increased '+money(-diff):'No change'}</span></div></div>`}).join('')}<div class="actions">${s.phase==='revision1'?'<button onclick="toApartment()">Continue to Apartment Search</button>':`<button onclick="toApartment()">${s.idealApartment?'Change Apartment':'Find Apartment'}</button>`}${s.phase==='revision2'&&s.finalApartment?'<button onclick="finalize()">Finalize My Budget</button>':''}<button class="secondary" onclick="downloadSave()">Download Save</button></div>${s.idealApartment?`<p class="fine">First apartment: ${escapeHtml(s.idealApartment.neighborhood)} · ${money(s.idealApartment.rent)}/month</p>`:''}${s.finalApartment?`<p class="fine">Current apartment: ${escapeHtml(s.finalApartment.neighborhood)} · ${money(s.finalApartment.rent)}/month</p>`:''}<p class="fine">A negative balance is allowed. The purpose is to evaluate realistic tradeoffs, not force an artificial surplus.</p></div>`}
function escapeHtml(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bind(){document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('change',()=>{let k=el.dataset.key;s[k]=el.type==='checkbox'?el.checked:el.type==='number'?Math.max(+el.min||0,Math.min(+el.max||10000,+el.value||0)):el.value;if(s.phase==='guided'){s.health=s.dental=s.vision=true;if(s.car==='none')s.car='basic';if(+s.saving<5)s.saving=5;if(+s.retirement<5)s.retirement=5}save();render()}));document.querySelectorAll('[data-personal]').forEach(el=>el.addEventListener('change',()=>{let k=el.dataset.personal;s.personal[k]=Math.max(0,Math.min(2000,+el.value||0));save();render()}))}function start(){if(s.phase==='welcome'){s.student=document.getElementById('student').value.trim();s.phase='pathway';s.step=0;save();render()}}function confirmPathway(){let p=document.querySelector('input[name=pathway]:checked')?.value;if(!PATHS[p]){alert('Please choose an education pathway.');return}if(!confirm('Lock in '+PATHS[p].label+'? You cannot change this education choice during the game.'))return;s.pathway=p;s.phase='guided';s.step=0;save();render()}function next(){if(personalTotal()<200){alert('Allocate at least $200 in personal spending.');return}if(s.step<categories.length-1){s.step++;save();render()}else{if(personalTotal()<200){alert('Allocate at least $200 for personal spending.');return}s.first=snapshot();s.phase='revision1';save();render()}}function back(){if(personalTotal()<200){alert('Allocate at least $200 in personal spending.');return}s.step=Math.max(0,s.step-1);save();render()}function edit(id){s.editing=id;save();render()}function returnDashboard(){if(personalTotal()<200){alert('Allocate at least $200 in personal spending.');return}s.editing=null;save();render()}function goDashboard(){s.phase=s.idealApartment?'revision2':'revision1';s.editing=null;save();render()}function toApartment(){if(s.phase==='revision1')s.revised=snapshot();s.phase='apartment';save();render()}function apartmentForm(){let a=s.aptForm;return `<label><span>Neighborhood</span><input id="neighborhood" value="${escapeHtml(a.neighborhood)}" placeholder="e.g., Bay Ridge"></label><label><span>Advertised monthly rent ($)</span><input type="number" id="rent" min="1" value="${escapeHtml(a.rent)}" placeholder="e.g., 1950"></label><label><span>Listing URL</span><input id="url" type="url" style="width:100%" value="${escapeHtml(a.url)}" placeholder="https://streeteasy.com/..."></label><label><span>Heat and hot water</span><select id="heat"><option value="unknown" ${a.heat==='unknown'?'selected':''}>Not specified</option><option value="included" ${a.heat==='included'?'selected':''}>Included in rent</option><option value="separate" ${a.heat==='separate'?'selected':''}>Paid separately</option></select></label><p class="fine">If heat and hot water are included, the provisional $80 heating estimate is removed from utilities when you save the apartment.</p>`}function saveApartment(){let neighborhood=document.getElementById('neighborhood').value.trim(),rent=+document.getElementById('rent').value,url=document.getElementById('url').value.trim(),heat=document.getElementById('heat').value;if(!neighborhood||!Number.isFinite(rent)||rent<=0||!/^https?:\/\//i.test(url)){alert('Please enter a neighborhood, positive monthly rent, and a valid listing URL.');return}let a={neighborhood,rent,url,heat};s.aptForm=a;if(!s.idealApartment)s.idealApartment=structuredClone(a);s.finalApartment=structuredClone(a);s.phase='revision2';save();render()}function resetGame(){if(!confirm('Start a new game? Your current browser progress will be erased. Download a save first if you want to keep it.'))return;s=structuredClone(defaults);save();render()}function downloadSave(){save();let blob=new Blob([JSON.stringify({app:'Can You Afford Your Life?',version:3,state:s},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='brooklyn-budget-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function loadSave(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(data.app!=='Can You Afford Your Life?'||![2,3].includes(data.version)||!data.state)throw Error('Unrecognized save file');s={...structuredClone(defaults),...data.state};if(s.phase!=='welcome'&&!PATHS[s.pathway])throw Error('Missing education pathway');save();render()}catch(err){alert('Could not load save: '+err.message)}};r.readAsText(f);e.target.value=''}

function journey(){let stages=['Education','Build your life','Revise','Apartment hunt','One year later','Life happens'];let i=({welcome:0,pathway:0,guided:1,revision1:2,apartment:3,revision2:3,final:3,year:4,events:5,done:5})[s.phase]??0;document.getElementById('journey').innerHTML='<div class="journey">'+stages.map((x,j)=>`<span class="${j===i?'active':j<i?'past':''}">${j+1}. ${x}</span>`).join('')+'</div>'}
function finalize(){if(!s.finalApartment||personalTotal()<200)return;s.final=snapshot();s.events=null;s.answers=[];s.phase='final';save();render()}
function projection(){let f=s.final,c=f.choices;let savings=f.net*c.saving/100*12,retirement=f.net*c.retirement/100*12,balance=f.balance*12;return {income:f.net*12,expenses:(f.total-f.costs.saving)*12,savings,retirement,balance,available:Math.max(0,savings+balance)}}
function signed(n){return (n<0?'−':'+')+money(Math.abs(n))}
function eventPool(){let c=s.final.choices,f=s.final,p=projection();let e=(id,group,title,story,options,eligible=true)=>({id,group,title,story,options,eligible});return [
e('car',0,'Car trouble','Your car needs $900 in repairs.',[['Pay for repairs',900,'Keep your car usable; savings or borrowing must cover the bill.'],['Finance the repair',900,'Preserve cash now but owe principal plus possible interest.'],['Delay and arrange rides',150,'Lower immediate cost, but the repair remains unpaid.']],c.car!=='none'),
e('dental',0,'Dental emergency',`You need a procedure. Your simulated bill is ${money(c.dental?175:800)} after any coverage.`,[['Pay the bill',c.dental?175:800,'Resolve the issue now.'],['Ask for installments',c.dental?175:800,'Spread the cost; check fees and terms.']]),
e('damage',0,'Apartment water damage',`A covered-type leak damages $1,500 of belongings. ${+c.renters?'Assume your policy covers the loss with a $250 deductible.':'You have no renters insurance.'}`,[['Replace everything',+c.renters?250:1500,'Restore your belongings; coverage is illustrative.'],['Replace essentials only',+c.renters?250:450,'Reduce spending but go without some belongings.']]),
e('phone',0,'Broken phone','Your phone stops working.',[['New phone',750,'Get a new device at a higher cost.'],['Refurbished phone',200,'Save money but accept an older device.'],['Finance a new phone',750,'Pay over time; check interest and fees.']]),
e('medical',0,'Unexpected medical bill',`An injury requires treatment. Assume your share is ${money(c.health?350:2200)}.`,[['Pay the bill',c.health?350:2200,'Cover the cost immediately.'],['Request a payment plan',c.health?350:2200,'Spread the obligation; ask about assistance.']]),
e('subway',1,'Subway shutdown','Your usual route is disrupted for a week.',[['Alternative paid rides',120,'Spend more to protect your commute.'],['Slower alternate route',0,'Keep costs down but allow extra travel time.']],+c.transit>0),
e('rent',1,'Rent increase','At renewal your rent rises 5% in this hypothetical lease.',[['Accept the increase',c.finalApartment.rent*.05*12,'This is the extra annual cost.'],['Cut other spending',c.finalApartment.rent*.05*12,'Offset the annual increase by reducing other spending.'],['Explore moving',0,'Avoid committing now; moving costs and new rent are uncertain.']]),
e('hours',1,'Reduced work hours','Your take-home pay falls 20% for one month.',[['Use available funds',f.net*.2,'Cover the lost income if funds permit.'],['Cut expenses',f.net*.2,'Find enough reductions to cover the shortfall.'],['Borrow',f.net*.2,'Cover the gap now but repay later.']]),
e('utility',1,'Utility bill spike','Extreme weather adds $125 to your electric bill.',[['Pay the bill',125,'Cover the extra cost.'],['Request installments',125,'Spread the cost if the provider agrees.']]),
e('travel',1,'Unexpected trips','You need several extra trips outside your usual routine.',[['Paid rides',180,'Convenient but costly.'],['Arrange shared rides',40,'Save money but coordinate schedules.'],['Cancel nonessential trips',0,'Avoid the expense but miss activities.']]),
e('wedding',2,'Friend’s wedding','Attending a wedding costs $800.',[['Attend',800,'Share the occasion but spend more.'],['Attend on a tighter budget',250,'Participate with fewer extras.'],['Decline',0,'Preserve funds but miss the event.']]),
e('vacation',2,'Vacation invitation','Friends invite you on a $1,200 trip.',[['Go',1200,'Enjoy the trip but reduce financial flexibility.'],['Suggest a cheaper trip',300,'Spend less if friends agree.'],['Stay home',0,'Save money but miss the experience.']]),
e('bonus',2,'Unexpected bonus','You receive $600 after taxes.',[['Save the bonus',-600,'Increase available funds.'],['Spend the bonus',0,'Enjoy the extra income without increasing savings.'],['Pay down debt',0,'Reduce obligations if you have debt; otherwise save it.']]),
e('family',2,'Family needs help','A relative asks for $500 toward an emergency.',[['Give $500',500,'Provide full support but reduce your cushion.'],['Give $100',100,'Help within a smaller budget.'],['Decline',0,'Protect your finances but cannot provide money.']]),
e('career',2,'Career opportunity','A professional certification costs $400. Future earnings are not guaranteed.',[['Enroll',400,'Invest in skills with uncertain returns.'],['Wait',0,'Keep your funds and revisit later.'],['Look for employer funding',0,'Avoid committing until funding is confirmed.']])];}
function beginEvents(){if(!s.events){let pool=eventPool();s.events=[0,1,2].map(g=>{let a=pool.filter(e=>e.group===g&&e.eligible);return a[Math.floor(Math.random()*a.length)].id});s.answers=[]}s.phase='events';save();render()}
function answer(i){let e=eventPool().find(x=>x.id===s.events[s.answers.length]);if(!e||!e.options[i])return;s.answers.push(i);save();render()}
function advance(){if(s.answers.length===3)s.phase='done';else s.eventIndex=s.answers.length;save();render()}
function renderEnd(){let app=document.getElementById('app'),f=s.final,p=projection();let tile=(l,v)=>`<div class="tile">${l}<div class="value">${v}</div></div>`;let actions=x=>`<div class="actions">${x}</div>`;let comparison=()=>`<div style="overflow:auto"><table class="compare"><tr><th>Monthly budget</th><th>Original</th><th>Revised</th><th>Final</th></tr>${categories.slice(1).map(([id,n])=>`<tr><td>${n}</td>${[s.first,s.revised,f].map(a=>`<td>${money(a.costs[id])}</td>`).join('')}</tr>`).join('')}<tr><th>Balance</th>${[s.first,s.revised,f].map(a=>`<th>${signed(a.balance)}</th>`).join('')}</tr></table></div>`;let year=()=>`<div class="grid">${tile('Annual take-home pay',money(p.income))}${tile('Living expenses & loans',money(p.expenses))}${tile('Planned emergency savings',money(p.savings))}${tile('Planned retirement contributions',money(p.retirement))}${tile('Accumulated surplus / shortfall',signed(p.balance))}${tile('Available non-retirement funds',money(p.available))}</div><p class="fine">Assumes 12 identical months, no starting savings, raises, inflation or interest. Shortfalls reduce available cash first; any remaining shortfall is unfunded, not automatically credit-card debt. Retirement is not available for emergencies.</p>`;let body='';if(s.phase==='final'){body=`<h2>Your final budget</h2><div class="grid">${tile('Monthly take-home',money(f.net))}${tile('Monthly allocations',money(f.total))}${tile('Monthly balance',signed(f.balance))}</div>${comparison()}<p>First apartment: ${escapeHtml(s.idealApartment.neighborhood)} · ${money(s.idealApartment.rent)}<br>Final apartment: ${escapeHtml(s.finalApartment.neighborhood)} · ${money(s.finalApartment.rent)}</p>${actions('<button class="secondary" onclick="s.phase=\'revision2\';save();render()">Return to revisions</button><button onclick="s.phase=\'year\';s.eventIndex=0;save();render()">Fast Forward One Year →</button>')}`}else if(s.phase==='year'){body=`<h2>One year later…</h2>${year()}${actions('<button onclick="beginEvents()">Life Happens! →</button>')}`}else if(s.phase==='events'){let i=s.eventIndex||0,e=eventPool().find(x=>x.id===s.events[i]),a=s.answers[i];body=`<span class="pill">Event ${i+1} of 3</span><div class="eventhero">${art(e.id)}<div>${['Unexpected emergency','Financial disruption','Personal opportunity'][i]}</div><h2>${e.title}</h2>${e.story}</div><div class="tile">Projected available funds: <strong>${money(p.available)}</strong> · Monthly balance: <strong>${signed(f.balance)}</strong></div><p>What would you do?</p>${e.options.map(([label,cost],j)=>`<button class="option ${a===j?'selected':''}" ${a!==undefined?'disabled':''} onclick="answer(${j})"><span>${label}</span><small>${cost>0?money(cost)+" financial impact":cost<0?money(-cost)+" potential savings":"No immediate extra cost"}</small></button>`).join('')}${a!==undefined?`<div class="notice"><strong>Your decision</strong><p>${e.options[a][2]}</p><p>${e.options[a][1]>0?'Financial impact: '+money(e.options[a][1])+(e.options[a][1]>p.available?' — exceeds projected available funds by '+money(e.options[a][1]-p.available):' — within projected available funds.'):e.options[a][1]<0?'Potential additional savings: '+money(-e.options[a][1]):'No immediate additional cost.'}</p></div>${actions('<button onclick="advance()">'+(i===2?'Finish game':'Next event')+' →</button>')}`:''}<p class="fine">Each scenario is independent and does not change your budget or projected funds.</p>`}else{body=`<h2>Journey complete!</h2>${comparison()}<h3>One-year projection</h3>${year()}<h3>Your life decisions</h3>${s.events.map((id,i)=>{let e=eventPool().find(x=>x.id===id),a=e.options[s.answers[i]];return `<div class="tile"><strong>${e.title}</strong><p>${a[0]} — ${a[2]}</p></div>`}).join('')}${actions('<button onclick="downloadSave()">Download completed game</button><button class="secondary" onclick="window.print()">Print summary</button>')}`}app.innerHTML='<div class="panel">'+body+'</div>'}

render();
</script></body></html>
